<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ensilados Santa Cruz</title>
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('fondo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            max-width: 250px;
            height: auto;
            margin-bottom: 15px;
        }

        .slogan {
            max-width: 300px;
            height: auto;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            justify-items: center;
        }

        .link-item {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: block;
            /* Ensure anchor behaves like a block for the image */
        }

        .link-item:hover {
            transform: scale(1.1);
        }

        .link-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Fallback if images fail to load */
        .link-item {
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <img src="LOGO.png" alt="Ensilados Santa Cruz" class="logo">
            <img src="slogans.png" alt="Pequeñas Granjas, Grandes Ideas" class="slogan">
        </div>

        <div class="links-grid">
            <a href="https://www.instagram.com/ensilados.scz/" class="link-item" aria-label="Instagram">
                <img src="instagram.png" alt="Instagram">
            </a>
            <a href="https://www.tiktok.com/@ensiladossantacruz?_r=1&_t=ZM-91NpQtClVTY" class="link-item"
                aria-label="TikTok">
                <img src="tiktok.png" alt="TikTok">
            </a>
            <a href="#" class="link-item" aria-label="YouTube">
                <img src="youtube.png" alt="YouTube">
            </a>
            <a href="https://ensiladossantacruz.com/" class="link-item" aria-label="Website">
                <img src="WEB.png" alt="Website">
            </a>
            <a href="https://www.facebook.com/profile.php?id=100094355722930" class="link-item" aria-label="Facebook">
                <img src="facebook.png" alt="Facebook">
            </a>
            <a href="https://api.whatsapp.com/send/?phone=59162223121&text&type=phone_number&app_absent=0"
                class="link-item" aria-label="WhatsApp">
                <img src="WSP.png" alt="WhatsApp">
            </a>
        </div>
    </div>

</body>

</html>
